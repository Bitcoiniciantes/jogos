<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voa Parente - Bitcoin Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.4), transparent);
            background-size: 200px 100px;
            animation: sparkle 4s linear infinite;
            z-index: 0;
        }

        @keyframes sparkle {
            from { transform: translateY(0); }
            to { transform: translateY(-100px); }
        }

        #gameContainer {
            position: relative;
            width: 420px;
            height: 640px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 0 40px rgba(247, 147, 26, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #startScreen {
            background: linear-gradient(180deg, rgba(15, 12, 41, 0.9), rgba(48, 43, 99, 0.9));
            backdrop-filter: blur(5px);
        }

        #gameOverScreen {
            background: linear-gradient(180deg, rgba(40, 0, 0, 0.92), rgba(15, 12, 41, 0.92));
            backdrop-filter: blur(5px);
            display: none;
        }

        #countdownScreen {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            display: none;
        }

        .game-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2em;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #f7931a, #ffdd57, #f7931a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease infinite;
            text-align: center;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            text-align: center;
        }

        .game-over-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.4em;
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
            margin-bottom: 15px;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px 40px;
            margin: 15px 0;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .score-label {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-value {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5em;
            color: #ffdd57;
            text-shadow: 0 0 15px rgba(255, 221, 87, 0.4);
        }

        .best-score-value {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3em;
            color: #7bed9f;
            margin-top: 5px;
        }

        .medal {
            font-size: 3em;
            margin: 10px 0;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .btn {
            padding: 14px 40px;
            font-size: 1.1em;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #f7931a, #ffdd57);
            color: #1a1a2e;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 5px 20px rgba(247, 147, 26, 0.4);
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 8px 30px rgba(247, 147, 26, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Fredoka One', cursive;
            font-size: 3em;
            color: white;
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(255, 255, 255, 0.3);
            z-index: 5;
            transition: transform 0.15s ease;
        }

        #score.pop {
            transform: translateX(-50%) scale(1.3);
        }

        .countdown-number {
            font-family: 'Fredoka One', cursive;
            font-size: 6em;
            color: #ffdd57;
            text-shadow: 0 0 30px rgba(255, 221, 87, 0.6);
            animation: countPop 0.5s ease;
        }

        @keyframes countPop {
            0% { transform: scale(2); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .power-up-indicator {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9em;
            font-weight: 600;
            color: #7bed9f;
            text-shadow: 0 0 10px rgba(123, 237, 159, 0.5);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .power-up-indicator.active {
            opacity: 1;
        }

        .instructions {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .instruction-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.8);
        }

        .instruction-item .icon {
            font-size: 1.5em;
            display: block;
            margin-bottom: 3px;
        }

        .combo-display {
            position: absolute;
            top: 55px;
            right: 15px;
            font-family: 'Fredoka One', cursive;
            font-size: 1em;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .combo-display.active {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 450px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="420" height="640"></canvas>
        <div id="score">0</div>
        <div class="power-up-indicator" id="powerUpIndicator">🛡️ ESCUDO ATIVO</div>
        <div class="combo-display" id="comboDisplay">🔥 x2</div>

        <div class="overlay" id="startScreen">
            <div class="game-title">₿ Voa Parente</div>
            <div class="subtitle">Bitcoin Edition</div>
            <div class="instructions">
                <div class="instruction-item">
                    <span class="icon">👆</span>
                    Toque / Clique
                </div>
                <div class="instruction-item">
                    <span class="icon">⌨️</span>
                    Espaço / ↑
                </div>
                <div class="instruction-item">
                    <span class="icon">₿</span>
                    Colete moedas
                </div>
            </div>
            <button class="btn" id="startBtn">VOAR! 🚀</button>
        </div>

        <div class="overlay" id="gameOverScreen">
            <div class="game-over-title">MORREU! 💀</div>
            <div class="medal" id="medalDisplay">🥉</div>
            <div class="score-card">
                <div class="score-label">Pontuação</div>
                <div class="score-value" id="finalScore">0</div>
                <div style="margin-top:8px">
                    <span class="score-label">Recorde</span>
                    <div class="best-score-value" id="bestScore">0</div>
                </div>
            </div>
            <button class="btn" id="retryBtn">TENTAR DE NOVO 🔄</button>
        </div>

        <div class="overlay" id="countdownScreen">
            <div class="countdown-number" id="countdownNumber">3</div>
        </div>
    </div>

    <script>
    (() => {
        // ==================== CANVAS & ELEMENTS ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const countdownScreen = document.getElementById('countdownScreen');
        const countdownNumber = document.getElementById('countdownNumber');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const medalDisplay = document.getElementById('medalDisplay');
        const powerUpIndicator = document.getElementById('powerUpIndicator');
        const comboDisplay = document.getElementById('comboDisplay');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');

        // ==================== IMAGE ====================
        const birdImg = new Image();
        birdImg.src = 'irmao.png';

        // ==================== AUDIO (Web Audio API) ====================
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playTone(freq, duration, type = 'square', volume = 0.15) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playJump() { playTone(440, 0.12, 'sine', 0.1); setTimeout(() => playTone(580, 0.08, 'sine', 0.08), 50); }
        function playScore() { playTone(660, 0.1, 'sine', 0.12); setTimeout(() => playTone(880, 0.15, 'sine', 0.1), 80); }
        function playCoin() { playTone(988, 0.08, 'sine', 0.12); setTimeout(() => playTone(1318, 0.15, 'sine', 0.1), 60); }
        function playDeath() { playTone(200, 0.3, 'sawtooth', 0.12); setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.1), 150); }
        function playPowerUp() { playTone(523, 0.1, 'sine', 0.1); setTimeout(() => playTone(659, 0.1, 'sine', 0.1), 80); setTimeout(() => playTone(784, 0.2, 'sine', 0.12), 160); }

        // ==================== GAME CONFIG ====================
        const CONFIG = {
            gravity: 0.48,
            jumpForce: -8.5,
            pipeSpeed: 3,
            pipeGapStart: 210,
            pipeGapMin: 135,
            pipeWidth: 62,
            birdSize: 52,
            coinSize: 28,
            coinSpawnChance: 0.4,
            powerUpSpawnChance: 0.08,
            shieldDuration: 5000,
            maxSpeed: 5.5
        };

        // ==================== GAME STATE ====================
        let bird, pipes, coins, powerUps, particles, trailParticles;
        let score, bestScore, gameRunning, animationId;
        let currentGap, pipesPassed, combo, comboTimer;
        let shieldActive, shieldEndTime;
        let cameraShake, shakeIntensity;
        let groundOffset, cloudOffset;
        let dayPhase, frameCount;
        let speedMultiplier;

        bestScore = parseInt(localStorage.getItem('flappyBestScore') || '0');

        // ==================== PARTICLE SYSTEM ====================
        class Particle {
            constructor(x, y, vx, vy, color, size, life, type = 'circle') {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                this.type = type;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.life--;
                this.rotation += this.rotSpeed;
            }
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                if (this.type === 'star') {
                    drawStar(ctx, 0, 0, 5, this.size, this.size / 2, this.color);
                } else if (this.type === 'spark') {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size / 2, -1, this.size, 2);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            get dead() { return this.life <= 0; }
        }

        function drawStar(ctx, cx, cy, spikes, outerR, innerR, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const angle = (i * Math.PI) / spikes - Math.PI / 2;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
        }

        function emitTrail() {
            if (frameCount % 2 !== 0) return;
            trailParticles.push(new Particle(
                bird.x - bird.size / 2,
                bird.y + (Math.random() - 0.5) * 10,
                -1 - Math.random(),
                (Math.random() - 0.5) * 0.5,
                shieldActive ? 'rgba(123, 237, 159, 0.8)' : 'rgba(247, 147, 26, 0.7)',
                3 + Math.random() * 3,
                20 + Math.random() * 10
            ));
        }

        function emitScoreParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * 3, Math.sin(angle) * 3,
                    '#ffdd57', 4, 30, 'star'
                ));
            }
        }

        function emitCoinParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed, Math.sin(angle) * speed,
                    Math.random() > 0.5 ? '#f7931a' : '#ffdd57',
                    3 + Math.random() * 3, 25 + Math.random() * 15, 'star'
                ));
            }
        }

        function emitDeathParticles() {
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                particles.push(new Particle(
                    bird.x, bird.y,
                    Math.cos(angle) * speed, Math.sin(angle) * speed - 2,
                    ['#ff4757', '#ff6b6b', '#ffdd57', '#ff9f43'][Math.floor(Math.random() * 4)],
                    3 + Math.random() * 5, 40 + Math.random() * 20,
                    Math.random() > 0.5 ? 'spark' : 'circle'
                ));
            }
        }

        // ==================== CLOUDS ====================
        let clouds = [];
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: 30 + Math.random() * 150,
                    w: 50 + Math.random() * 80,
                    speed: 0.2 + Math.random() * 0.5,
                    opacity: 0.3 + Math.random() * 0.4
                });
            }
        }

        // ==================== COINS & POWER-UPS ====================
        function spawnCoin(pipeX, topHeight, bottomY) {
            if (Math.random() > CONFIG.coinSpawnChance) return;
            const gapCenter = topHeight + (bottomY - topHeight) / 2;
            coins.push({
                x: pipeX + CONFIG.pipeWidth / 2,
                y: gapCenter + (Math.random() - 0.5) * 40,
                size: CONFIG.coinSize,
                rotation: 0,
                collected: false,
                glow: 0
            });
        }

        function spawnPowerUp(pipeX, topHeight, bottomY) {
            if (Math.random() > CONFIG.powerUpSpawnChance || shieldActive) return;
            const gapCenter = topHeight + (bottomY - topHeight) / 2;
            powerUps.push({
                x: pipeX + CONFIG.pipeWidth + 40,
                y: gapCenter,
                size: 22,
                rotation: 0,
                collected: false,
                type: 'shield'
            });
        }

        // ==================== INIT ====================
        function initGame() {
            bird = {
                x: 90,
                y: canvas.height / 2,
                velocity: 0,
                size: CONFIG.birdSize,
                rotation: 0,
                flapAngle: 0
            };
            pipes = [];
            coins = [];
            powerUps = [];
            particles = [];
            trailParticles = [];
            score = 0;
            currentGap = CONFIG.pipeGapStart;
            pipesPassed = 0;
            combo = 0;
            comboTimer = 0;
            shieldActive = false;
            shieldEndTime = 0;
            cameraShake = 0;
            shakeIntensity = 0;
            groundOffset = 0;
            cloudOffset = 0;
            dayPhase = 0;
            frameCount = 0;
            speedMultiplier = 1;
            scoreDisplay.textContent = '0';
            powerUpIndicator.classList.remove('active');
            comboDisplay.classList.remove('active');
            initClouds();
        }

        // ==================== START WITH COUNTDOWN ====================
        function startGame() {
            initGame();
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            countdownScreen.style.display = 'flex';

            let count = 3;
            countdownNumber.textContent = count;

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.textContent = count;
                    countdownNumber.style.animation = 'none';
                    void countdownNumber.offsetWidth;
                    countdownNumber.style.animation = 'countPop 0.5s ease';
                    playTone(440, 0.1, 'sine', 0.08);
                } else if (count === 0) {
                    countdownNumber.textContent = 'GO!';
                    countdownNumber.style.animation = 'none';
                    void countdownNumber.offsetWidth;
                    countdownNumber.style.animation = 'countPop 0.5s ease';
                    playTone(880, 0.2, 'sine', 0.12);
                } else {
                    clearInterval(countInterval);
                    countdownScreen.style.display = 'none';
                    gameRunning = true;
                    if (animationId) cancelAnimationFrame(animationId);
                    gameLoop();
                }
            }, 700);
        }

        // ==================== JUMP ====================
        function jump() {
            if (!gameRunning) return;
            bird.velocity = CONFIG.jumpForce;
            bird.flapAngle = -25;
            playJump();
            // emit flap particles
            for (let i = 0; i < 3; i++) {
                trailParticles.push(new Particle(
                    bird.x - 10, bird.y + 10,
                    -2 - Math.random() * 2, 1 + Math.random(),
                    'rgba(255,255,255,0.5)', 2 + Math.random() * 2, 15
                ));
            }
        }

        // ==================== PIPE GENERATION ====================
        function addPipe() {
            currentGap = Math.max(CONFIG.pipeGapMin, CONFIG.pipeGapStart - pipesPassed * 4);
            speedMultiplier = Math.min(CONFIG.maxSpeed / CONFIG.pipeSpeed, 1 + pipesPassed * 0.015);

            const minY = 80;
            const maxY = canvas.height - currentGap - 100;
            const topHeight = Math.random() * (maxY - minY) + minY;
            const bottomY = topHeight + currentGap;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: bottomY,
                scored: false,
                color: `hsl(${120 + pipesPassed * 5}, 60%, 35%)`
            });

            spawnCoin(canvas.width, topHeight, bottomY);
            spawnPowerUp(canvas.width, topHeight, bottomY);
        }

        // ==================== UPDATE ====================
        function update() {
            frameCount++;

            // Bird physics
            bird.velocity += CONFIG.gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.max(-30, Math.min(bird.velocity * 3.5, 90));
            bird.flapAngle *= 0.85;

            // Trail
            emitTrail();

            // Shield timer
            if (shieldActive && Date.now() > shieldEndTime) {
                shieldActive = false;
                powerUpIndicator.classList.remove('active');
            }

            // Combo timer
            if (combo > 1) {
                comboTimer--;
                if (comboTimer <= 0) {
                    combo = 0;
                    comboDisplay.classList.remove('active');
                }
            }

            // Ground scroll
            groundOffset = (groundOffset + CONFIG.pipeSpeed * speedMultiplier) % 40;

            // Clouds
            for (let cloud of clouds) {
                cloud.x -= cloud.speed * speedMultiplier;
                if (cloud.x + cloud.w < 0) {
                    cloud.x = canvas.width + 20;
                    cloud.y = 30 + Math.random() * 150;
                }
            }

            // Pipe generation
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 220) {
                addPipe();
            }

            // Move pipes
            const speed = CONFIG.pipeSpeed * speedMultiplier;
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= speed;

                if (!pipes[i].scored && pipes[i].x + CONFIG.pipeWidth < bird.x) {
                    pipes[i].scored = true;
                    score++;
                    pipesPassed++;
                    combo++;
                    comboTimer = 90;

                    if (combo >= 2) {
                        comboDisplay.textContent = `🔥 x${combo}`;
                        comboDisplay.classList.add('active');
                    }

                    scoreDisplay.textContent = score;
                    scoreDisplay.classList.add('pop');
                    setTimeout(() => scoreDisplay.classList.remove('pop'), 150);
                    playScore();
                    emitScoreParticles(bird.x + 30, bird.y - 20);
                }

                if (pipes[i].x + CONFIG.pipeWidth < -10) {
                    pipes.splice(i, 1);
                }
            }

            // Move coins
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].x -= speed;
                coins[i].rotation += 0.08;
                coins[i].glow = (Math.sin(frameCount * 0.1) + 1) / 2;

                // Collect coin
                const dx = bird.x - coins[i].x;
                const dy = bird.y - coins[i].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (!coins[i].collected && dist < bird.size / 2 + coins[i].size / 2) {
                    coins[i].collected = true;
                    score += 2;
                    scoreDisplay.textContent = score;
                    scoreDisplay.classList.add('pop');
                    setTimeout(() => scoreDisplay.classList.remove('pop'), 150);
                    playCoin();
                    emitCoinParticles(coins[i].x, coins[i].y);
                }

                if (coins[i].x < -30 || coins[i].collected) {
                    if (coins[i].collected || coins[i].x < -30) coins.splice(i, 1);
                }
            }

            // Move power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].x -= speed;
                powerUps[i].rotation += 0.05;

                const dx = bird.x - powerUps[i].x;
                const dy = bird.y - powerUps[i].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (!powerUps[i].collected && dist < bird.size / 2 + powerUps[i].size) {
                    powerUps[i].collected = true;
                    shieldActive = true;
                    shieldEndTime = Date.now() + CONFIG.shieldDuration;
                    powerUpIndicator.textContent = '🛡️ ESCUDO ATIVO';
                    powerUpIndicator.classList.add('active');
                    playPowerUp();
                    emitCoinParticles(powerUps[i].x, powerUps[i].y);
                }

                if (powerUps[i].x < -30 || powerUps[i].collected) {
                    powerUps.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].dead) particles.splice(i, 1);
            }
            for (let i = trailParticles.length - 1; i >= 0; i--) {
                trailParticles[i].update();
                if (trailParticles[i].dead) trailParticles.splice(i, 1);
            }

            // Camera shake decay
            if (cameraShake > 0) cameraShake *= 0.9;

            // Collisions
            if (bird.y + bird.size / 2 > canvas.height - 30 || bird.y - bird.size / 2 < 0) {
                if (!shieldActive) { gameOver(); return; }
                else { bird.y = Math.max(bird.size / 2, Math.min(canvas.height - 30 - bird.size / 2, bird.y)); bird.velocity *= -0.5; }
            }

            for (let pipe of pipes) {
                const birdLeft = bird.x - bird.size / 2 + 10;
                const birdRight = bird.x + bird.size / 2 - 10;
                const birdTop = bird.y - bird.size / 2 + 10;
                const birdBottom = bird.y + bird.size / 2 - 10;

                if (birdRight > pipe.x && birdLeft < pipe.x + CONFIG.pipeWidth) {
                    if (birdTop < pipe.topHeight || birdBottom > pipe.bottomY) {
                        if (!shieldActive) {
                            gameOver();
                            return;
                        } else {
                            // Bounce off pipe with shield
                            cameraShake = 5;
                            bird.velocity *= -0.5;
                        }
                    }
                }
            }
        }

        // ==================== DRAW ====================
        function draw() {
            ctx.save();

            // Camera shake
            if (cameraShake > 0.5) {
                ctx.translate(
                    (Math.random() - 0.5) * cameraShake * 2,
                    (Math.random() - 0.5) * cameraShake * 2
                );
            }

            // Sky gradient (shifts subtly over time)
            const skyHue = 200 + Math.sin(frameCount * 0.002) * 10;
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, `hsl(${skyHue}, 70%, 65%)`);
            gradient.addColorStop(0.5, `hsl(${skyHue - 10}, 60%, 72%)`);
            gradient.addColorStop(0.85, `hsl(${skyHue - 30}, 50%, 75%)`);
            gradient.addColorStop(1, '#4a7c3f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun/Moon
            ctx.save();
            ctx.globalAlpha = 0.4;
            const sunGrad = ctx.createRadialGradient(350, 60, 5, 350, 60, 40);
            sunGrad.addColorStop(0, '#fff8dc');
            sunGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(350, 60, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Clouds
            for (let cloud of clouds) {
                ctx.save();
                ctx.globalAlpha = cloud.opacity;
                ctx.fillStyle = '#ffffff';
                const cx = cloud.x;
                const cy = cloud.y;
                ctx.beginPath();
                ctx.arc(cx, cy, cloud.w * 0.25, 0, Math.PI * 2);
                ctx.arc(cx + cloud.w * 0.2, cy - 8, cloud.w * 0.3, 0, Math.PI * 2);
                ctx.arc(cx + cloud.w * 0.45, cy, cloud.w * 0.25, 0, Math.PI * 2);
                ctx.arc(cx + cloud.w * 0.25, cy + 5, cloud.w * 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Background mountains
            ctx.fillStyle = 'rgba(60, 100, 60, 0.3)';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 80);
            for (let i = 0; i <= canvas.width; i += 50) {
                ctx.lineTo(i, canvas.height - 80 - Math.sin(i * 0.02 + frameCount * 0.005) * 30 - 20);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Trail particles (behind bird)
            for (let p of trailParticles) p.draw(ctx);

            // Pipes with gradient and details
            for (let pipe of pipes) {
                drawPipe(pipe);
            }

            // Coins
            for (let coin of coins) {
                if (coin.collected) continue;
                drawCoin(coin);
            }

            // Power-ups
            for (let pu of powerUps) {
                if (pu.collected) continue;
                drawPowerUp(pu);
            }

            // Bird
            drawBird();

            // Particles (in front)
            for (let p of particles) p.draw(ctx);

            // Ground
            drawGround();

            ctx.restore();
        }

        function drawPipe(pipe) {
            const pipeGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + CONFIG.pipeWidth, 0);
            pipeGrad.addColorStop(0, '#1e7a1e');
            pipeGrad.addColorStop(0.3, '#3cb043');
            pipeGrad.addColorStop(0.7, '#4caf50');
            pipeGrad.addColorStop(1, '#1e7a1e');

            // Top pipe body
            ctx.fillStyle = pipeGrad;
            ctx.fillRect(pipe.x, 0, CONFIG.pipeWidth, pipe.topHeight);

            // Top pipe cap
            const capGrad = ctx.createLinearGradient(pipe.x - 6, 0, pipe.x + CONFIG.pipeWidth + 6, 0);
            capGrad.addColorStop(0, '#166616');
            capGrad.addColorStop(0.3, '#2d8a2d');
            capGrad.addColorStop(0.7, '#3cb043');
            capGrad.addColorStop(1, '#166616');
            ctx.fillStyle = capGrad;
            roundRect(ctx, pipe.x - 6, pipe.topHeight - 28, CONFIG.pipeWidth + 12, 28, 4);
            ctx.fill();

            // Bottom pipe body
            ctx.fillStyle = pipeGrad;
            ctx.fillRect(pipe.x, pipe.bottomY, CONFIG.pipeWidth, canvas.height - pipe.bottomY);

            // Bottom pipe cap
            ctx.fillStyle = capGrad;
            roundRect(ctx, pipe.x - 6, pipe.bottomY, CONFIG.pipeWidth + 12, 28, 4);
            ctx.fill();

            // Pipe highlights
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(pipe.x + 8, 0, 6, pipe.topHeight - 28);
            ctx.fillRect(pipe.x + 8, pipe.bottomY + 28, 6, canvas.height - pipe.bottomY - 28);

            // Pipe shadows
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(pipe.x + CONFIG.pipeWidth - 12, 0, 8, pipe.topHeight - 28);
            ctx.fillRect(pipe.x + CONFIG.pipeWidth - 12, pipe.bottomY + 28, 8, canvas.height - pipe.bottomY - 28);
        }

        function drawCoin(coin) {
            ctx.save();
            ctx.translate(coin.x, coin.y);

            // Glow
            ctx.globalAlpha = 0.3 + coin.glow * 0.3;
            const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, coin.size);
            glow.addColorStop(0, '#f7931a');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, coin.size, 0, Math.PI * 2);
            ctx.fill();

            // Coin body (squish for 3D effect)
            ctx.globalAlpha = 1;
            const scaleX = Math.cos(coin.rotation);
            ctx.scale(scaleX, 1);

            // Outer ring
            ctx.fillStyle = '#f7931a';
            ctx.beginPath();
            ctx.arc(0, 0, coin.size / 2, 0, Math.PI * 2);
            ctx.fill();

            // Inner
            ctx.fillStyle = '#ffdd57';
            ctx.beginPath();
            ctx.arc(0, 0, coin.size / 2 - 3, 0, Math.PI * 2);
            ctx.fill();

            // Bitcoin symbol
            if (Math.abs(scaleX) > 0.3) {
                ctx.fillStyle = '#f7931a';
                ctx.font = `bold ${coin.size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('₿', 0, 1);
            }

            ctx.restore();
        }

        function drawPowerUp(pu) {
            ctx.save();
            ctx.translate(pu.x, pu.y);

            // Glow
            ctx.globalAlpha = 0.4 + Math.sin(frameCount * 0.1) * 0.2;
            const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, pu.size * 1.5);
            glow.addColorStop(0, '#7bed9f');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, pu.size * 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Shield icon
            ctx.globalAlpha = 1;
            ctx.font = `${pu.size * 1.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🛡️', 0, 2);

            ctx.restore();
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate((bird.rotation * Math.PI) / 180);

            // Shield aura
            if (shieldActive) {
                ctx.save();
                ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.15) * 0.15;
                const shieldGrad = ctx.createRadialGradient(0, 0, bird.size / 2, 0, 0, bird.size / 2 + 12);
                shieldGrad.addColorStop(0, 'transparent');
                shieldGrad.addColorStop(0.7, 'rgba(123, 237, 159, 0.4)');
                shieldGrad.addColorStop(1, 'rgba(123, 237, 159, 0)');
                ctx.fillStyle = shieldGrad;
                ctx.beginPath();
                ctx.arc(0, 0, bird.size / 2 + 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Clip for circular photo
            ctx.beginPath();
            ctx.arc(0, 0, bird.size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            if (birdImg.complete && birdImg.naturalWidth > 0) {
                const imgRatio = birdImg.naturalWidth / birdImg.naturalHeight;
                let drawW, drawH;
                if (imgRatio > 1) { drawH = bird.size; drawW = bird.size * imgRatio; }
                else { drawW = bird.size; drawH = bird.size / imgRatio; }
                ctx.drawImage(birdImg, -drawW / 2, -drawH / 2, drawW, drawH);
            } else {
                ctx.fillStyle = '#f7931a';
                ctx.fill();
            }

            ctx.restore();

            // Border ring
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate((bird.rotation * Math.PI) / 180);
            ctx.beginPath();
            ctx.arc(0, 0, bird.size / 2 + 3, 0, Math.PI * 2);
            ctx.strokeStyle = shieldActive ? '#7bed9f' : '#fff';
            ctx.lineWidth = shieldActive ? 4 : 3;
            ctx.shadowColor = shieldActive ? '#7bed9f' : '#f7931a';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.restore();

            // Wings
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate((bird.rotation * Math.PI) / 180);
            const wingFlap = Math.sin(frameCount * 0.3 + bird.flapAngle * 0.1) * 8;
            // Left wing
            ctx.fillStyle = '#f7931a';
            ctx.beginPath();
            ctx.ellipse(-bird.size / 2 - 3, 5 + wingFlap, 14, 8, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#e67e22';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // Right wing (smaller, behind)
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.ellipse(-bird.size / 2 + 5, -5 - wingFlap * 0.5, 10, 6, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawGround() {
            // Ground base
            const groundY = canvas.height - 30;
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            groundGrad.addColorStop(0, '#4a7c3f');
            groundGrad.addColorStop(0.3, '#3d6b35');
            groundGrad.addColorStop(1, '#2d5025');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, canvas.width, 30);

            // Grass blades
            ctx.fillStyle = '#5cb85c';
            for (let i = 0; i < canvas.width; i += 8) {
                const offset = (i + groundOffset) % 40;
                const h = 4 + Math.sin(i * 0.3) * 3;
                ctx.fillRect(i - offset % 8, groundY - h, 3, h);
            }

            // Ground line
            ctx.strokeStyle = '#2d8a2d';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Ground texture dots
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < canvas.width; i += 20) {
                const ox = (i + groundOffset * 0.5) % canvas.width;
                ctx.beginPath();
                ctx.arc(ox, groundY + 15, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ==================== GAME LOOP ====================
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // ==================== GAME OVER ====================
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            playDeath();
            emitDeathParticles();
            cameraShake = 15;

            // Continue rendering death particles
            let deathFrames = 0;
            function deathAnimation() {
                deathFrames++;
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].dead) particles.splice(i, 1);
                }
                for (let i = trailParticles.length - 1; i >= 0; i--) {
                    trailParticles[i].update();
                    if (trailParticles[i].dead) trailParticles.splice(i, 1);
                }
                cameraShake *= 0.9;
                draw();
                if (deathFrames < 40) requestAnimationFrame(deathAnimation);
                else showGameOver();
            }
            deathAnimation();
        }

        function showGameOver() {
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappyBestScore', bestScore);
            }

            finalScoreEl.textContent = score;
            bestScoreEl.textContent = bestScore;

            // Medal
            if (score >= 50) medalDisplay.textContent = '🏆';
            else if (score >= 30) medalDisplay.textContent = '🥇';
            else if (score >= 15) medalDisplay.textContent = '🥈';
            else if (score >= 5) medalDisplay.textContent = '🥉';
            else medalDisplay.textContent = '💩';

            gameOverScreen.style.display = 'flex';
        }

        // ==================== CONTROLS ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!gameRunning) {
                    if (startScreen.style.display !== 'none') startGame();
                    else if (gameOverScreen.style.display !== 'none') startGame();
                } else {
                    jump();
                }
            }
        });

        canvas.addEventListener('click', () => {
            if (gameRunning) jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameRunning) jump();
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        retryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        // ==================== IDLE ANIMATION ON START SCREEN ====================
        function idleAnimation() {
            if (startScreen.style.display === 'none' && gameOverScreen.style.display === 'none') return;

            // Draw a nice idle background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#87CEEB');
            grad.addColorStop(0.7, '#98D8E8');
            grad.addColorStop(1, '#4a7c3f');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Animated clouds on idle
            frameCount++;
            cloudOffset += 0.5;
            for (let cloud of clouds) {
                cloud.x -= cloud.speed * 0.5;
                if (cloud.x + cloud.w < 0) cloud.x = canvas.width + 20;
            }
            for (let cloud of clouds) {
                ctx.save();
                ctx.globalAlpha = cloud.opacity;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.w * 0.25, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.w * 0.2, cloud.y - 8, cloud.w * 0.3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.w * 0.45, cloud.y, cloud.w * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawGround();

            requestAnimationFrame(idleAnimation);
        }

        initGame();
        initClouds();
        idleAnimation();

    })();
    </script>
